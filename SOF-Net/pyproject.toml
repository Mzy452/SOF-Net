[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofnet-offshore"
version = "0.1.0"
description = "SAR-prior-guided optical fusion for offshore infrastructure mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "scipy>=1.11",
  "rasterio>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66"
]

[tool.setuptools]
packages = ["sofnet"]
py-modules = ["build_sar_prior", "prepare_dataset", "train", "test"]

[project.scripts]
sofnet-build-prior = "build_sar_prior:main"
sofnet-prepare = "prepare_dataset:main"
sofnet-train = "train:main"
sofnet-test = "test:main"

