seed: 42
device: cuda
data:
  sar_prior_manifest: "Real Filepath"
  raw_manifest: "Real Filepath"
  processed_root: "Real Filepath"
  patch_size: 1000
  stride: 1000
  optical_channels: 6
  sar_channels: 8
  num_workers: 4
  negative_keep_probability: 1.0
sar_prior:
  gf3_weight: 0.60
  sentinel1_weight: 0.40
  pfa: 0.000001
  background_window: 31
  guard_window: 7
  persistence_threshold: 0.60
  roi_threshold: 0.25
  roi_buffer: 128
  epsilon: 0.000001
model:
  feature_channels: 256
  attention_heads: 8
  attention_points: 4
  displacement_radii: [8, 4, 2, 1]
  component_classes: 5
  component_names: [platform_body, bridge, crane, flare_related_structure, helipad]
  mask_size: 28
  pretrained_backbones: false
  detection_threshold: 0.30
  nms_iou: 0.50
  max_detections: 100
loss:
  cls: 1.0
  centerness: 1.0
  box: 2.0
  segmentation: 1.0
  boundary: 0.5
  prior: 0.2
training:
  epochs: 300
  batch_size: 16
  optimizer: SGD
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 5
  gradient_clip: 5.0
  output_dir: "Real Filepath"
  resume: "Real Filepath"
evaluation:
  checkpoint: "Real Filepath"
  output_dir: "Real Filepath"
  small_object_area: 1024
  boundary_tolerance: 2
  high_quality_threshold: 0.80
  medium_quality_threshold: 0.50
priority:
  flare_area_saturation: 0.05
  platform_area_saturation: 5000.0
  component_count_saturation: 8
  weights: [0.3333333333, 0.3333333333, 0.3333333333]
